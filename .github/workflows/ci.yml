name: CI

# Automatic checks on every change (plan step M2.5).
# Jobs: tidy-check + lint + type-check + unit tests + build; a
# secret scan (gitleaks) — the free substitute for GitHub's paid
# secret scanning, recorded as the M2.4 deviation (test T-SEC-01);
# and a database job that applies the migrations to a real
# PostgreSQL + PostGIS and runs the map-brain proof (plan steps
# M3.3 / M3.4 / M3.5).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tidy, lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (exact, from the lockfile)
        run: npm ci

      - name: Tidy check (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check (TypeScript)
        run: npm run typecheck

      # The M5.6 parks loader (and so its test) imports
      # node:sqlite, which Node 22 still gates behind
      # --experimental-sqlite (unflagged on Node 23+; the
      # flag is accepted and harmless there).
      - name: Unit tests (Vitest)
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: npm test

      - name: Build the site
        run: npm run build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          GITLEAKS_VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

  database:
    name: Database — migrations + PostGIS proof
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: cmnh
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: check_my_next_home
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmnh -d check_my_next_home"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://cmnh:postgres@localhost:5432/check_my_next_home
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (exact, from the lockfile)
        run: npm ci

      - name: Apply the migrations (plan steps M3.3 / M3.5)
        run: npm run db:migrate

      - name: Apply them again — must be a no-op
        run: npm run db:migrate

      - name: Prove the map brain (plan step M3.4)
        run: npm run db:prove
      - name: Seed the practice facts (plan step M3.6)
        run: npm run db:seed

      - name: Verify the seed landed
        run: npm run db:seed -- --verify
      - name: Load the postcode directory fixture (plan step M4.1)
        run: npm run load:postcodes -- --file tests/fixtures/onspd
      - name: Load the sold prices fixture (plan step M4.2)
        run: npm run load:sold-prices -- --file tests/fixtures/land-registry "CM3 2JT" "E16 1GN"
      - name: Load the crime fixture (plan step M4.3)
        run: npm run load:crime -- --file tests/fixtures/police-uk "CM3 2JT" "E16 1GN"
      - name: Load the EPC fixture (plan step M4.5)
        run: npm run load:epc -- --file tests/fixtures/epc "CM3 2JT" "E16 1GN"
      - name: Load the schools fixture (plan step M4.6)
        run: npm run load:schools -- --file tests/fixtures/schools
      - name: Load the health fixture (plan step M4.7)
        run: npm run load:health -- --file tests/fixtures/health

      # The M5.6 places loader cuts its extracts with pyosmium
      # (pip package "osmium", the version the prep measured),
      # and the M5.6 parks loader reads its GeoPackage with
      # node:sqlite — unflagged on Node 23+, still behind
      # --experimental-sqlite on the Node 22 line this job
      # runs, hence the NODE_OPTIONS on the steps that reach
      # it (the flag is accepted and harmless where the
      # module is unflagged).
      - name: Set up the OSM extract cutter (plan step M5.6)
        run: pip install osmium==4.3.2

      - name: Runner — fixture pass over all loaders (plan step M4.8)
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: node loaders/run-loaders.mjs --file tests/fixtures --kind practice --env ci --no-canary --no-email

      - name: Load the planning-area fixture (plan step M5.2)
        run: node loaders/load-planning-areas.mjs --file tests/fixtures/planning-areas
      - name: Load the green-belt fixture (plan step M5.2)
        run: node loaders/load-green-belt.mjs --file tests/fixtures/green-belt
      - name: Load the heritage fixture (plan step M5.2)
        run: node loaders/load-heritage.mjs --file tests/fixtures/heritage
      - name: Load the nature designations fixture (plan step M5.3)
        run: node loaders/load-nature-designations.mjs --file tests/fixtures/nature-designations
      - name: Load the priority habitats fixture (plan step M5.3)
        run: node loaders/load-priority-habitats.mjs --file tests/fixtures/priority-habitats
      - name: Load the flood zones fixture (plan step M5.1)
        run: node loaders/load-flood-zones.mjs --file tests/fixtures/flood-zones
      - name: Load the flood rivers and sea fixture (plan step M5.1)
        run: node loaders/load-flood-rivers-sea.mjs --file tests/fixtures/flood-rivers-sea
      - name: Load the flood surface water fixture (plan step M5.1)
        run: node loaders/load-flood-surface-water.mjs --file tests/fixtures/flood-surface-water
      - name: Load the transport fixture (plan step M5.5)
        run: node loaders/load-transport.mjs --file tests/fixtures/transport
      - name: Load the nearby places fixture (plan step M5.6)
        run: node loaders/load-osm-places.mjs --file tests/fixtures/osm-places
      - name: Load the greenspace fixture (plan step M5.6)
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: node loaders/load-os-greenspace.mjs --file tests/fixtures/os-greenspace
