# Check My Next Home — the database recipe (plan step M3.1).
#
# One service: the fact store — PostgreSQL with PostGIS, the "map brain"
# (the PostGIS extension itself is switched on and proved in step M3.4).
# This file is only the recipe: the database is created wherever Docker
# runs it — a developer machine during the build, the Hetzner server at
# M12. PostgreSQL + PostGIS is the project's only database (plan rule).
#
# M7.3 adds the app service below: the served Next codebase
# (pages + API route handlers over the frozen brains),
# running beside the database. The play server stands up
# with both services; production at M12 is the same recipe.
#
# The password is never written in this file. Put POSTGRES_PASSWORD (and
# the matching DATABASE_URL for the app) in .env.local — see
# .env.example, Key K6 — then:
#
#   Start:  docker compose --env-file .env.local up -d db
#   Stop:   docker compose --env-file .env.local down
#
# Stopping keeps the data. Adding -v to the stop command deletes the
# stored data as well — destructive, use with care.

services:
  db:
    image: postgis/postgis:17-3.5
    container_name: cmnh-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cmnh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local (Key K6)}
      POSTGRES_DB: ${POSTGRES_DB:-check_my_next_home}
    ports:
      # Localhost only — the database is never exposed to the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - cmnh-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmnh} -d ${POSTGRES_DB:-check_my_next_home}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # The served app (plan step M7.3). Runtime secrets arrive
  # through the same .env.local (Key K6's DATABASE_URL is
  # composed here from the database service's own values so
  # the two can never drift; the Turnstile secret is K5's
  # server key). Only the website answers from outside —
  # on the server it binds localhost and Cloudflare Access
  # fronts it; the database port stays silent (M12.2).
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_SITE_ENV: ${NEXT_PUBLIC_SITE_ENV:-play}
    container_name: cmnh-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cmnh}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-check_my_next_home}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY in .env.local (Key K5)}
      REPORT_PDF_R2_ENDPOINT: ${REPORT_PDF_R2_ENDPOINT:-}
      REPORT_PDF_R2_BUCKET: ${REPORT_PDF_R2_BUCKET:-}
      REPORT_PDF_R2_ACCESS_KEY_ID: ${REPORT_PDF_R2_ACCESS_KEY_ID:-}
      REPORT_PDF_R2_SECRET_ACCESS_KEY: ${REPORT_PDF_R2_SECRET_ACCESS_KEY:-}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PAYMENT_PUBLISHABLE_KEY: ${PAYMENT_PUBLISHABLE_KEY:-}
      PAYMENT_TEST_API_KEY: ${PAYMENT_TEST_API_KEY:-}
      PAYMENT_TEST_WEBHOOK_SECRET: ${PAYMENT_TEST_WEBHOOK_SECRET:-}
      PAYMENT_TEST_PUBLISHABLE_KEY: ${PAYMENT_TEST_PUBLISHABLE_KEY:-}
      TEST_BUYER_EMAILS: ${TEST_BUYER_EMAILS:-}
      # K16, the report signing secret (BUG-148, 22 Nov
      # 2026): without this line the app container never
      # received it — getReportDeliveryService() returned
      # null in-app and every signed-link flow (download
      # verification, re-issue, buyer re-send, gift
      # claiming) answered not-configured, masked because
      # the host worker sources .env.local directly. The
      # play server carried it through a server-local
      # override from 22 Nov; that entry retires when
      # this deploys.
      REPORT_SIGNING_SECRET: ${REPORT_SIGNING_SECRET:-}
      # The mail configuration (K11's key + one FROM name
      # per sender — the EM-14 wiring fix, 22 Nov 2026:
      # without these lines the app container carried no
      # mail config at all and every in-app send answered
      # not-configured). REPORT_DELIVERY_FROM and
      # ALERT_EMAIL_TO have defaults in the code, so
      # their lines may stay empty; the other FROM names
      # have none — an unplaced one leaves only its own
      # send unconfigured.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      REPORT_DELIVERY_FROM: ${REPORT_DELIVERY_FROM:-}
      GIFT_CONFIRMATION_FROM: ${GIFT_CONFIRMATION_FROM:-}
      CONTACT_NOTIFICATION_FROM: ${CONTACT_NOTIFICATION_FROM:-}
      CONTACT_ACKNOWLEDGEMENT_FROM: ${CONTACT_ACKNOWLEDGEMENT_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  cmnh-pgdata:
